name: Viikko 5 - Testit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Hae koodi
        uses: actions/checkout@v6

      - name: Asenna Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Asenna kirjastot
        run: python -m pip install -r requirements.txt

      - name: Suorita testit
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
