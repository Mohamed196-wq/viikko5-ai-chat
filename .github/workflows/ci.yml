name: Viikko 5 - Testit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Hae koodi
        uses: actions/checkout@v6

      - name: Asenna Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Asenna kirjastot
        run: python -m pip install -r requirements.txt

      - name: Suorita testit
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Hae koodi
        uses: actions/checkout@v6

      - name: Yhdista Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Julkaise palvelimelle A
        env:
          SSH_KEY: ${{ secrets.CPOUTA_SSH_KEY }}
          HOST: ${{ secrets.CPOUTA_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/viikko5_actions
          chmod 600 ~/.ssh/viikko5_actions
          ssh -i ~/.ssh/viikko5_actions -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=.github/ssh_known_hosts ubuntu@"$HOST" 'bash /home/ubuntu/viikko5/scripts/deploy.sh'
